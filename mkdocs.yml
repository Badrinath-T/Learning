site_name: Learning
site_url: https://badrinath-t.github.io/Learning/
repo_url: https://github.com/Badrinath-T/Learning

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Low-Level Design:
      - Overview: LLD/README.md
      - Design Patterns:
          - Overview: LLD/design-patterns/overview.md
          - Catalog: LLD/design-patterns/catalog.md
